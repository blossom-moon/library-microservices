syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Library.Contracts.Loans";

package loans;

// Читання видач для внутрішніх сервісів (Aggregator).
// ПРАВИЛО СУМІСНОСТІ: номери полів не змінюються й не використовуються повторно після публікації.
service LoansService {
  // Видача з переліком книг. NotFound — видачі немає; InvalidArgument — id <= 0.
  rpc GetLoan (GetLoanRequest) returns (LoanReply);
}

message GetLoanRequest {
  int64 id = 1;
}

message LoanReply {
  int64 loan_id = 1;
  int64 reader_id = 2;
  string status = 3;
  google.protobuf.Timestamp loan_date = 4;
  google.protobuf.Timestamp due_date = 5;
  google.protobuf.Timestamp return_date = 6;   // не встановлено, поки видачу не закрито
  Money fine_amount = 7;
  repeated LoanItemReply items = 8;
}

message LoanItemReply {
  int64 book_id = 1;
  string book_title = 2;
  google.protobuf.Timestamp returned_at = 3;   // не встановлено, поки книгу не повернуто
}

// Десяткова сума: 12.50 → units = 12, nanos = 500_000_000
message Money {
  int64 units = 1;
  int32 nanos = 2;
}
