syntax = "proto3";

option csharp_namespace = "Library.Contracts.Reviews";

package reviews;

// Читання відгуків для внутрішніх сервісів (Aggregator).
// ПРАВИЛО СУМІСНОСТІ: номери полів не змінюються й не використовуються повторно після публікації.
service ReviewsService {
  // Відгуки на кілька книг одним викликом (до 100 книг, до page_size відгуків на книгу).
  // InvalidArgument — порожній список, забагато книг або некоректний page_size.
  rpc GetReviewsByBookIds (GetReviewsByBookIdsRequest) returns (ReviewsReply);
}

message GetReviewsByBookIdsRequest {
  repeated int64 book_ids = 1;
  int32 page_size = 2;            // 0 → значення за замовчуванням (20)
}

message ReviewReply {
  string id = 1;                  // ObjectId документа
  int64 book_id = 2;
  string book_title = 3;
  string author_name = 4;
  int32 rating = 5;
  string text = 6;
  int32 comments_count = 7;
  int32 version = 8;
}

message ReviewsReply {
  repeated ReviewReply reviews = 1;
}
