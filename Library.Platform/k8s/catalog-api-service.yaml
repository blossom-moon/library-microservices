apiVersion: v1
kind: Service
metadata:
  name: catalog-api           # DNS-ім'я: http://catalog-api
spec:
  type: ClusterIP             # доступний лише всередині кластера
  selector:
    app: catalog-api          # поди за лейблом із Deployment
  ports:
  - { name: http, port: 80, targetPort: 8080 }     # порт сервісу → порт контейнера
  - { name: grpc, port: 8081, targetPort: 8081 }
