apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4-management-alpine
        ports:
        - { name: amqp, containerPort: 5672 }
        - { name: management, containerPort: 15672 }
        env:
        - { name: RABBITMQ_DEFAULT_USER, value: guest }
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS }
        readinessProbe:
          tcpSocket: { port: 5672 }
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app: rabbitmq }
  ports:
  - { name: amqp, port: 5672, targetPort: 5672 }
  - { name: management, port: 15672, targetPort: 15672 }
